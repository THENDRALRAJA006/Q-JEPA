[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "surakshit-bharat-q-jepa"
version = "0.1.0"
description = "AI-powered ambulance routing with JEPA-style traffic forecasting"
authors = [{name = "Surakshit Bharat Team"}]
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.23.0",
    "pydantic>=2.0.0",
    "streamlit>=1.30.0",
    "plotly>=7.0.0",
    "networkx>=3.1.0",
    "pyyaml>=6.0",
    "pyarrow>=12.0.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.21.0"]
vision = ["opencv-python>=4.8.0", "matplotlib>=3.7.0"]
maps = ["folium>=0.14.0", "streamlit-folium>=0.15.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
