# Default configuration for Surakshit Bharat Q-JEPA Traffic

project_name: "Surakshit Bharat Q-JEPA Traffic"
version: "0.1.0"

data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  synthetic_dir: "data/synthetic"
  default_seed: 42
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

simulation:
  num_nodes: 30
  num_edges: 60
  time_steps: 288
  time_step_minutes: 5
  seed: 42
  max_speed_kmh: 60.0
  min_speed_kmh: 5.0
  incident_probability: 0.02
  closure_probability: 0.005

forecasting:
  horizons: [1, 3, 6]
  lstm_hidden: 64
  lstm_layers: 2
  lstm_dropout: 0.2
  lstm_epochs: 30
  lstm_lr: 0.001
  lstm_batch: 32
  window_size: 12
  jepa_embed_dim: 64
  jepa_pred_dim: 64
  jepa_ema_tau: 0.99
  jepa_epochs: 30
  jepa_lr: 0.001
  jepa_batch: 32

routing:
  risk_penalty: 0.3
  reroute_threshold_pct: 10.0
  reroute_min_interval_s: 60
  sa_temperature: 100.0
  sa_cooling: 0.98
  sa_iterations: 500

api:
  host: "0.0.0.0"
  port: 8000
  reload: false
  log_level: "info"

models_dir: "models"
results_dir: "results"
checkpoints_dir: "models/checkpoints"
