# Q-JEPA Foundation Model (JEPAGraph-FM) — Large Configuration
# High-capacity research scaling configuration for distributed multi-GPU training
model:
  scale: large
  in_channels: 3
  hidden_dim: 128
  num_layers: 6
  dilations: [1, 2, 4, 8, 1, 2]
  kernel_size: 2
  input_window: 12
  output_window: 12
  predictor_layers: 3
  dropout: 0.15
  ema_decay: 0.999
  mask_ratio: 0.25

training:
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0001
  max_epochs: 100
  early_stopping_patience: 15
  gradient_clip_norm: 5.0
  device: cuda
  use_amp: true
  subsample_ratio: 1.0
  max_samples_per_dataset: null
  checkpoint_dir: models/foundation
  checkpoint_name: jepagraph_fm_large.pt

objectives:
  w_jepa: 1.0
  w_mask: 0.5
  w_sup: 1.0
  w_temp: 0.05
  huber_delta: 1.0

datasets:
  mixture:
    - metr_la
    - pems_bay
    - pems03
    - pems04
    - pems07
    - pems08
  sampling_temperature: 0.5
